<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }

    .cian-marker {
      background: transparent;
      border: none;
    }

    .marker-wrap {
      width: 1px;
      height: 1px;
      overflow: visible;
      position: relative;
    }

    .marker-bubble {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      background: #fff;
      color: #3d4b6b;
      font: 700 13px/1.1 Arial, sans-serif;
      padding: 6px 8px;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(0,0,0,.18);
      white-space: nowrap;
      border: 1px solid rgba(0,0,0,.08);
      letter-spacing: -0.1px;
    }

    .marker-bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -4px;
      transform: translateX(-50%);
      width: 7px;
      height: 7px;
      background: #fff;
      border-right: 1px solid rgba(0,0,0,.08);
      border-bottom: 1px solid rgba(0,0,0,.08);
      transform-origin: center;
      rotate: 45deg;
    }

    .marker-dot {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 10px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #1f6fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 1px 2px rgba(0,0,0,.15);
    }

    .marker-dot.cluster {
      width: 9px;
      height: 9px;
      background: #1f6fff;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const API_BASE = 'http://localhost:8000/api';
    const map = L.map('map').setView([55.751244, 37.618423], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    function makeMarkerHtml(text, isCluster) {
      return `
        <div class="marker-wrap">
          <div class="marker-bubble">${text}</div>
          <div class="marker-dot ${isCluster ? 'cluster' : ''}"></div>
        </div>
      `;
    }

    function addPriceMarker(lat, lng, price) {
      L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'cian-marker',
          html: makeMarkerHtml(`${price / 1000} тыс./мес`, false),
          iconSize: [1, 1],
          iconAnchor: [0, 0]
        })
      }).addTo(markersLayer);
    }

    function addClusterMarker(lat, lng, count, minPrice) {
      L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'cian-marker',
          html: makeMarkerHtml(count + ` от ${minPrice / 1000} тыс./мес`, true),
          iconSize: [1, 1],
          iconAnchor: [0, 0]
        })
      }).addTo(markersLayer);
    }

    async function loadPosters() {
      const bounds = map.getBounds();
      const sw = bounds.getSouthWest();
      const ne = bounds.getNorthEast();
      const zoom = map.getZoom();

      const url = new URL(`${API_BASE}/posters/geo`);
      url.searchParams.set('sw_lat', sw.lat);
      url.searchParams.set('sw_lon', sw.lng);
      url.searchParams.set('ne_lat', ne.lat);
      url.searchParams.set('ne_lon', ne.lng);
      url.searchParams.set('zoom', zoom);

      const res = await fetch(url.toString());
      if (!res.ok) return;

      const data = await res.json();
      markersLayer.clearLayers();

      (data.features || []).forEach(item => {
        const coords = item.geometry?.coordinates || [];
        const lng = coords[0];
        const lat = coords[1];
        const props = item.properties || item.propertiese || {};

        if (typeof lat !== 'number' || typeof lng !== 'number') return;

        if (props.cluster) {
          addClusterMarker(lat, lng, props.count || 1, props.priceMin);
        } else {
          addPriceMarker(lat, lng, props.price || '');
        }
      });
    }

    let timer;
    function scheduleLoad() {
      clearTimeout(timer);
      timer = setTimeout(loadPosters, 250);
    }

    map.on('moveend zoomend', scheduleLoad);
    map.whenReady(loadPosters);
  </script>
</body>
</html>
